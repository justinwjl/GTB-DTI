output_dir: ./experiment/

dataset:
  class: Davis
  path: ./data/
  split: random
  threshold: 30

task:
  class: regression
  model:
    class: GraphCPI_GIN
    param:
      dropout: 0.6 # GAT: 0.6, GCN: 0.5, GIN : 0.6
  train: kfold

param_feature:
  ngram: 3
  atom_property: True
  hydrogen_info: True
  electron_p: True
  stereochemistry: True
  structural: True
  edge: False

optimizer:
  class: Adam
  lr: 5.0e-4

engine:
  device: [0]
  batch_size: 512

train:
  num_epoch: 400

eval_metric: ['mse', 'rmse', 'mae', 'r2', 'pcc', 'ci','spearman']
score_metric: mse