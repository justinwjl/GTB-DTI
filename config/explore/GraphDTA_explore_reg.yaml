output_dir: ./experiment/

dataset:
  class: Davis
  path: ./data/
  split: random
  threshold: 30

task:
  class: regression
  model:
    class: GCNNet_pretrain
    param:
      dropout: 0.2
  train: kfold

param_feature:
  atom_property: False
  hydrogen_info: False
  electron_p: False
  stereochemistry: False
  structural: False
  edge: False
  use_pretrain: True

optimizer:
  class: Adam
  lr: 5.0e-4

engine:
  device: [0]
  batch_size: 512

train:
  num_epoch: 400

eval_metric: ['mse', 'rmse', 'mae', 'r2', 'pcc', 'ci', 'spearman']
score_metric: mse