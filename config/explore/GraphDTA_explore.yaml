output_dir: ./experiment/

dataset:
  class: Drugbank # Human
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: GCNNet
    param:
      dropout: 0.2
  train: kfold

param_feature:
  atom_property: True
  hydrogen_info: False
  electron_p: False
  stereochemistry: False
  structural: False
  edge: False

optimizer:
  class: Adam
  lr: 5.0e-4

engine:
  device: [0]
  batch_size: 512

train:
  num_epoch: 400

eval_metric: ['roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1