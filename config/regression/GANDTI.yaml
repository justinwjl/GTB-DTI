output_dir: ./experiment/

dataset:
  class: DAVIS
  path: ./data/
  split: random
  threshold: 30

task:
  class: regression
  model:
    class: GanDTI
    param: 
      features: 40
      GNN_depth: 3
      MLP_depth: 2 
      dropout: 0.5
  train: kfold

param_feature:
  radius: 2
  ngram: 3

optimizer:
  class: Adam
  lr: 0.001
  weight_decay: 1.0e-6
  # The paper says only "Adam optimizer is used with the learning rate of 0.001 and the weight
  # decay of 10^-6"; amsgrad comes from the code, main.py:119-120.
  amsgrad: True

engine:
  device: [0]
  # The recipe prescribes 1 (CPI paper: "Note that the batch size is 1"; GanDTI Sec 2.3: "with a batch size of 1"), but 1 would put a single model-dataset pair beyond 1e8 sequential updates under the 1000-epoch five-fold protocol, none of them filling the GPU.
  batch_size: 32

train:
  num_epoch: 1000

eval_metric: ['mse', 'rmse', 'mae', 'r2', 'pcc', 'ci','spearman']
score_metric: mse