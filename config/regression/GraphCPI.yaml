output_dir: ./experiment/

dataset:
  class: DAVIS
  path: ./data/
  split: random
  threshold: 30

task:
  class: regression
  model:
    class: GraphCPI_GIN
    param:
      # Neither the BIBM paper nor its journal extension (Lin et al., IEEE/ACM TCBB 2023) reports a
      # dropout rate, and the released repo never contained the model files its training.py imports.
      # Those imports name models.gcn / gat / gat_gcn / ginconv -- GraphDTA's modules, which all
      # default to 0.2 -- so 0.2 is the only rate traceable to GraphCPI's own release, and it keeps
      # GraphCPI vs GraphDTA a contrast in protein encoding alone.
      dropout: 0.2
  train: kfold

param_feature:
  ngram: 3

optimizer:
  class: Adam
  lr: 5.0e-4

engine:
  device: [0]
  batch_size: 512

train:
  num_epoch: 1000

eval_metric: ['mse', 'rmse', 'mae', 'r2', 'pcc', 'ci','spearman']
score_metric: mse