output_dir: ./experiment/

dataset:
  class: BindingDB_Kd
  path: ./data/
  split: random
  threshold: 30

task:
  class: regression
  model:
    class: BridgeDTI
    param:
      outSize: 128
      cHiddenSizeList: [ 1024 ]
      fHiddenSizeList: [ 1024,256 ]
      fSize: 1024
      cSize: 8450 # 8422
      gcnHiddenSizeList: [ 128,128 ]
      fcHiddenSizeList: [ 128 ]
      nodeNum: 64
      hdnDropout: 0.5 #0.5
      fcDropout: 0.5 #0.5
  train: kfold

param_feature:
  pSeqMaxLen: 1024
  dSeqMaxLen: 128
  cSize: 8450 # 8422

optimizer:
  class: Adam
  lr: 0.001            # paper: "The Adam optimizer with learning rate 0.001 is used"
  weight_decay: 0.002
  # Paper: "the L2 regularization coefficient lambda is set to 0.001". The released code defaults
  # weightDecay to 0 and the README never overrides it, so this follows the paper over the code.
  # Note Eq. 11 writes the penalty as lambda * sum ||theta||^2 with no 1/2, so a strict translation
  # to PyTorch's coupled decay would be 2*lambda; we record the coefficient the paper states.
  clip_grad_norm: 20   # upstream DL_ClassifierModel.py:257, clip_grad_norm_(max_norm=20)

engine:
  device: [0]
  batch_size: 512

train:
  num_epoch: 1000

eval_metric: ['mse', 'rmse', 'mae', 'r2', 'pcc', 'ci', 'spearman']
score_metric: mse
