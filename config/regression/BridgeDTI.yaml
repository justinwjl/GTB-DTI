output_dir: ./experiment/

dataset:
  class: BindingDB_Kd
  path: ./data/
  split: random
  threshold: 30

task:
  class: regression
  model:
    class: BridgeDTI
    param:
      outSize: 128
      cHiddenSizeList: [ 1024 ]
      fHiddenSizeList: [ 1024,256 ]
      fSize: 1024
      cSize: 8450 # 8422
      gcnHiddenSizeList: [ 128,128 ]
      fcHiddenSizeList: [ 128 ]
      nodeNum: 64
      hdnDropout: 0.5 #0.5
      fcDropout: 0.5 #0.5
  train: kfold

param_feature:
  pSeqMaxLen: 1024
  dSeqMaxLen: 128
  cSize: 8450 # 8422

optimizer:
  class: Adam
  lr: 0.001

engine:
  device: [0]
  batch_size: 512

train:
  num_epoch: 400

eval_metric: ['mse', 'rmse', 'mae', 'r2', 'pcc', 'ci', 'spearman']
score_metric: mse
