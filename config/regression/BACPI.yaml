output_dir: ./experiment/

dataset:
  class: DAVIS
  path: ./data/
  split: random
  threshold: 30

task:
  class: regression
  model:
    class: BACPI
    param: 
      comp_dim: 80
      prot_dim: 80
      gat_dim: 50
      num_head: 3
      dropout: 0.1
      alpha: 0.1
      window: 5
      layer_cnn: 3
      latent_dim: 80
      layer_out: 3  
  train: kfold

param_feature:
  radius: 2
  ngram: 3

optimizer:
  class: Adam
  lr: 5.0e-4
  scheduler: True
  # Upstream halves the lr once, at the midpoint of a 20-epoch run (main.py:58,61 --
  # StepLR(step_size=10, gamma=0.5) over num_epochs=20). Rescaled to this benchmark's
  # 1000-epoch budget so the single halving still lands at the midpoint.
  step_size: 500
  gamma: 0.5
  amsgrad: True   # main.py:57 -- Adam(..., weight_decay=0, amsgrad=True)

engine:
  device: [0]
  batch_size: 16

train:
  num_epoch: 1000

eval_metric: ['mse', 'rmse', 'mae', 'r2', 'pcc', 'ci','spearman']
score_metric: mse