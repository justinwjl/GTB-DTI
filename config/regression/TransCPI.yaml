output_dir: ./experiment/

dataset:
  class: DAVIS
  path: ./data/
  split: random
  threshold: 30

task:
  class: regression
  model:
    class: TransCPI
    param: 
      protein_dim: 100
      atom_dim: 34
      hid_dim: 64
      n_layers: 3
      n_heads: 8
      pf_dim: 256
      dropout: 0.2
      kernel_size: 5

  train: kfold

param_feature:
  ngram: 3

optimizer:
  class: RAdam
  lr: 1.0e-4
  scheduler: True
  step_size: 5
  gamma: 0.5
  weight_decay: 1.0e-4

engine:
  device: [0]
  batch_size: 8

train:
  num_epoch: 400

eval_metric: ['mse', 'rmse', 'mae', 'r2', 'pcc', 'ci', 'spearman']
score_metric: mse