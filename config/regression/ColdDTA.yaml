output_dir: ./experiment/

dataset:
  class: DAVIS
  path: ./data/
  split: random
  threshold: 30

task:
  class: regression
  model:
    class: ColdDTA
    param:
      dropout: 0
  train: kfold
  
optimizer:
  class: Adam
  lr: 0.0003

engine:
  device: [0]
  batch_size: 128

train:
  num_epoch: 400

eval_metric: ['mse', 'rmse', 'mae', 'r2', 'pcc', 'ci','spearman']
score_metric: mse