output_dir: ./experiment/

dataset:
  class: Drugbank
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: BACPI
    param: 
      comp_dim: 80
      prot_dim: 80
      gat_dim: 50
      num_head: 3
      dropout: 0.1
      alpha: 0.1
      window: 5
      layer_cnn: 3
      latent_dim: 80
      layer_out: 3  
  train: kfold

param_feature:
  radius: 2
  ngram: 3

optimizer:
  class: Adam
  lr: 5.0e-4
  scheduler: True
  # Upstream's own step size (main.py:58,61 -- StepLR(step_size=10, gamma=0.5) over
  # num_epochs=20), kept unscaled so the lr trajectory matches upstream epoch for epoch. The
  # decay then bounds the run on its own: lr reaches 4.9e-7 by epoch 100, improvement stops,
  # and early stopping ends the fold well before the 1000-epoch cap.
  step_size: 10
  gamma: 0.5
  amsgrad: True   # main.py:57 -- Adam(..., weight_decay=0, amsgrad=True)

engine:
  device: [0]
  batch_size: 16

train:
  num_epoch: 1000

eval_metric: ['roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1