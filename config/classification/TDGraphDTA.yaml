output_dir: ./experiment/

dataset:
  class: Drugbank
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: TDGraphDTA
    param:
      block_num: 4 #[2, 4, 8]
      # vocab_protein_size : 3
      embedding_size: 128
      filter_num: 32
      # No dropout key here: upstream hardcodes nn.Dropout(0.1) three times in the classifier (model.py:368,371,374) and its constructor takes no dropout argument, which models/TDGraphDTA.py:33,36,39 mirrors exactly.

  train: kfold

param_feature:
  max_seq_len: 1000

optimizer:
  class: Adam
  lr: 0.0005

engine:
  device: [0]
  batch_size: 1024

train:
  num_epoch: 1000

eval_metric: ['roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1
