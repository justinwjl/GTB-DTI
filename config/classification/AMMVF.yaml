output_dir: ./experiment/

dataset:
  class: Drugbank
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: AMMVF
    param:
      protein_dim: 100
      atom_dim: 34
      hid_dim: 64
      n_layers: 3
      n_heads: 8
      gat_heads: 3
      alpha: 0.2
      k_feature: 16
      k_dim: 16
      pf_dim: 256
      dropout: 0.1
  train: kfold

param_feature:
  radius: 2
  ngram: 3

optimizer:
  class: Adam
  lr: 0.001
  scheduler: False   # upstream trains at a constant lr 1e-3; its decay block is commented out
  weight_decay: 1.0e-4

engine:
  device: [0]
  batch_size: 32

train:
  num_epoch: 1000

eval_metric: ['roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1
