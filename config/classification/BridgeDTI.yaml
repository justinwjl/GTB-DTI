output_dir: ./experiment/

dataset:
  class: Drugbank
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: BridgeDTI
    param:
      outSize: 128
      cHiddenSizeList: [ 1024 ]
      fHiddenSizeList: [ 1024,256 ]
      fSize: 1024
      cSize: 8450 # 8422
      gcnHiddenSizeList: [ 128,128 ]
      fcHiddenSizeList: [ 128 ]
      nodeNum: 64
      hdnDropout: 0.5 #0.5
      fcDropout: 0.5 #0.5
  train: kfold

param_feature:
  pSeqMaxLen: 1024
  dSeqMaxLen: 128
  cSize: 8450 # 8422

optimizer:
  class: Adam
  lr: 0.001            # paper: "The Adam optimizer with learning rate 0.001 is used"
  # Paper Eq.11 penalises lambda * sum ||theta||^2 with lambda = 0.001 and NO 1/2 factor while PyTorch weight_decay=w adds w*theta, so w = 2*lambda.
  weight_decay: 0.002
  clip_grad_norm: 20   # upstream DL_ClassifierModel.py:257, clip_grad_norm_(max_norm=20)

engine:
  device: [0]
  batch_size: 512

train:
  num_epoch: 1000

eval_metric: [ 'roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1
