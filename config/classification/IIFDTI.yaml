output_dir: ./experiment/

dataset:
  class: Drugbank
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: IIFDTI
    param: 
      hid_dim: 64
      n_layers: 3
      kernel_size: 9
      n_heads: 8
      pf_dim: 256
      dropout: 0.2
  train: kfold

param_feature:
  ngram: 3

optimizer:
  class: AdamW
  lr: 0.001
  weight_decay: 1.0e-6

engine:
  device: [0]
  batch_size: 64

train:
  num_epoch: 1000

eval_metric: ['roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1