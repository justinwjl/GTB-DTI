output_dir: ./experiment/

dataset:
  class: Drugbank
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: CSDTI
    param:
      dropout: 0.2
  train: kfold

optimizer:
  class: Adam
  lr: 5.0e-4

engine:
  device: [0]
  # The paper states no batch size (Sec 4.1 gives only the 8:1:1 split), so the code decides.
  # Its --batch_size default of 256 is dead: train.py:73-74 build both DataLoaders with a literal
  # batch_size=512, so 512 is what every published CSDTI number was trained at.
  batch_size: 512

train:
  num_epoch: 1000

eval_metric: ['roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1