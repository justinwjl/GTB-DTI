output_dir: ./experiment/

dataset:
  class: Drugbank
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: ColdDTA
    param:
      # ColdDTA has no dropout. 
      dropout: 0
  train: kfold
  
optimizer:
  class: Adam
  lr: 3.0e-4

engine:
  device: [0]
  batch_size: 128

train:
  num_epoch: 1000

eval_metric: ['roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1