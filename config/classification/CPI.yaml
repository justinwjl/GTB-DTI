output_dir: ./experiment/

dataset:
  class: Drugbank
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: CPINet
    param: 
      dim: 10
      layer_gnn: 3
      side: 5
      layer_cnn: 3
      layer_out: 3
      dropout: 0
  train: kfold

param_feature:
  radius: 2
  ngram: 3

optimizer:
  class: Adam
  lr: 1.0e-3
  scheduler: True
  # Upstream's own step size (run_training.py:212-217 -- halved every 10 epochs over a 99-epoch
  # run, 9 decays), kept unscaled so the lr trajectory matches upstream epoch for epoch. The 9th
  # and last upstream decay lands at epoch 90, and the decay then bounds the run on its own:
  # early stopping ends the fold well before the 1000-epoch cap.
  step_size: 10
  gamma: 0.5
  weight_decay: 1.0e-6

engine:
  device: [0]
  batch_size: 32

train:
  num_epoch: 1000

eval_metric: ['roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1