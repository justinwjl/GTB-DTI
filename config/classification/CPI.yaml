output_dir: ./experiment/

dataset:
  class: Drugbank
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: CPINet
    param: 
      dim: 10
      layer_gnn: 3
      side: 5
      layer_cnn: 3
      layer_out: 3
      dropout: 0
  train: kfold

param_feature:
  radius: 2
  ngram: 3

optimizer:
  class: Adam
  lr: 1.0e-3
  scheduler: True
  # Upstream halves the lr every 10 epochs over a 99-epoch run (run_training.py:212-217), so it
  # decays 9 times. Rescaled so the same 9 decays span this benchmark's 1000-epoch budget.
  step_size: 110
  gamma: 0.5
  weight_decay: 1.0e-6

engine:
  device: [0]
  batch_size: 32

train:
  num_epoch: 1000

eval_metric: ['roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1