output_dir: ./experiment/

dataset:
  class: Drugbank
  path: ./data/
  split: random
  threshold: 30

task:
  class: classification
  model:
    class: TransCPI
    param: 
      protein_dim: 100
      atom_dim: 34
      hid_dim: 64
      n_layers: 3
      n_heads: 8
      pf_dim: 256
      dropout: 0.2
      kernel_size: 5

  train: kfold

param_feature:
  ngram: 3

optimizer:
  class: RAdam
  lr: 1.0e-4
  scheduler: True
  step_size: 5
  gamma: 0.5
  weight_decay: 1.0e-4

engine:
  device: [0]
  batch_size:   32

train:
  num_epoch: 1000

eval_metric: ['roc-auc', 'pr-auc', 'range_logAUC', 'accuracy', 'precision', 'recall', 'f1']
score_metric: f1